name: Documentation site

# Builds the documentation site (site/, a krantho static site whose pages are
# the markdown files in docs/) and publishes it to GitHub Pages at
# https://cantara.github.io/distributed-saga/ when either changes on main.
# Pages publishes from GitHub Actions, and only main may deploy to it. A pull
# request that changes them builds the site, so a page that breaks the build
# is found before it is merged, and deploys nothing.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# One deployment at a time, and one that has started always finishes; a pull
# request's build gives way to a newer push to it
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history: each page is dated by its file's last commit
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The figures of docs/images are drawn by site/diagrams/generate.mjs: an SVG that differs from what the script
      # draws was edited by hand, or its source was changed without drawing it again
      - name: The figures match their sources
        run: node diagrams/generate.mjs > /dev/null && git diff --exit-code -- ../docs/images
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      # Where Pages serves the site, https://cantara.github.io/distributed-saga:
      # every page's canonical link, the sitemap and the path the pages are
      # served under (/distributed-saga) come from it. A pull request builds
      # for the same address.
      - run: pnpm run build
        env:
          KRANTHO_SITE_BASE_URL: ${{ steps.pages.outputs.base_url || 'https://cantara.github.io/distributed-saga' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
