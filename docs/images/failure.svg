<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 829 410" width="829" height="410" role="img" aria-labelledby="failure-title failure-desc">
<title id="failure-title">A failure that is not an abort</title>
<desc id="failure-desc">b throws another exception; the walk fails and the traversal stops; onComplete runs and the completion future fails; End on E is not written, so recovery runs b again.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<line class="lifeline" x1="78" y1="62" x2="78" y2="394"/>
<rect class="box" x="20" y="20" width="116" height="42" rx="7"/>
<text x="78" y="45.5" class="title" text-anchor="middle">Caller</text>
<line class="lifeline" x1="428.4" y1="62" x2="428.4" y2="394"/>
<rect class="box" x="370.4" y="20" width="116" height="42" rx="7"/>
<text x="428.4" y="45.5" class="title" text-anchor="middle">Walk</text>
<line class="lifeline" x1="657.6" y1="62" x2="657.6" y2="394"/>
<rect class="box" x="599.6" y="20" width="116" height="42" rx="7"/>
<text x="657.6" y="45.5" class="title" text-anchor="middle">Log</text>
<line class="edge" x1="438.4" y1="102" x2="656.6" y2="102"/>
<path class="head" d="M656.6,102 L647.6,106.5 L647.6,97.5 Z"/>
<text x="548" y="95" class="label" text-anchor="middle">Start(S), Start(a), End(a)</text>
<circle class="num" cx="428.4" cy="102" r="9"/>
<text x="428.4" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge" x1="438.4" y1="140" x2="656.6" y2="140"/>
<path class="head" d="M656.6,140 L647.6,144.5 L647.6,135.5 Z"/>
<text x="548" y="133" class="label" text-anchor="middle">Start(b)</text>
<circle class="num" cx="428.4" cy="140" r="9"/>
<text x="428.4" y="143.8" class="num-text" text-anchor="middle">2</text>
<rect class="note" x="259.6" y="160" width="337.5" height="44" rx="5"/>
<text x="428.4" y="180" class="label" text-anchor="middle">the action throws: the walk fails,</text>
<text x="428.4" y="196" class="label" text-anchor="middle">the traversal stops, the failure is recorded</text>
<rect class="note" x="320.2" y="216" width="216.4" height="28" rx="5"/>
<text x="428.4" y="236" class="label" text-anchor="middle">the walk ends: no walk left</text>
<line class="edge" x1="418.4" y1="274" x2="79" y2="274"/>
<path class="head" d="M79,274 L88,269.5 L88,278.5 Z"/>
<text x="248.2" y="267" class="label" text-anchor="middle">onComplete(failure)</text>
<circle class="num" cx="428.4" cy="274" r="9"/>
<text x="428.4" y="277.8" class="num-text" text-anchor="middle">3</text>
<line class="edge dash" x1="418.4" y1="312" x2="79" y2="312"/>
<path class="head" d="M79,312 L88,307.5 L88,316.5 Z"/>
<text x="248.2" y="305" class="label" text-anchor="middle">completion future fails with that exception</text>
<circle class="num" cx="428.4" cy="312" r="9"/>
<text x="428.4" y="315.8" class="num-text" text-anchor="middle">4</text>
<rect class="note" x="506.7" y="332" width="301.9" height="44" rx="5"/>
<text x="657.6" y="352" class="label" text-anchor="middle">no End(E): the execution is unfinished,</text>
<text x="657.6" y="368" class="label" text-anchor="middle">and recovery will run b again</text>
</svg>
