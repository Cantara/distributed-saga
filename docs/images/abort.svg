<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1022 754" width="1022" height="754" role="img" aria-labelledby="abort-title abort-desc">
<title id="abort-title">An abort and its rollback</title>
<desc id="abort-desc">b throws AbortSagaException; Abort is written; once no walk is left, the rollback compensates a between CompStart and Comp, writes End on E, and the completion future fails with the AbortSagaException.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<line class="lifeline" x1="78" y1="62" x2="78" y2="738"/>
<rect class="box" x="20" y="20" width="116" height="42" rx="7"/>
<text x="78" y="45.5" class="title" text-anchor="middle">Caller</text>
<line class="lifeline" x1="466.3" y1="62" x2="466.3" y2="738"/>
<rect class="box" x="408.3" y="20" width="116" height="42" rx="7"/>
<text x="466.3" y="45.5" class="title" text-anchor="middle">Walk</text>
<line class="lifeline" x1="637.8" y1="62" x2="637.8" y2="738"/>
<rect class="box" x="579.8" y="20" width="116" height="42" rx="7"/>
<text x="637.8" y="45.5" class="title" text-anchor="middle">Adapter of b</text>
<line class="lifeline" x1="793.8" y1="62" x2="793.8" y2="738"/>
<rect class="box" x="735.8" y="20" width="116" height="42" rx="7"/>
<text x="793.8" y="45.5" class="title" text-anchor="middle">Adapter of a</text>
<line class="lifeline" x1="943.8" y1="62" x2="943.8" y2="738"/>
<rect class="box" x="885.8" y="20" width="116" height="42" rx="7"/>
<text x="943.8" y="45.5" class="title" text-anchor="middle">Log</text>
<line class="edge" x1="476.3" y1="102" x2="942.8" y2="102"/>
<path class="head" d="M942.8,102 L933.8,106.5 L933.8,97.5 Z"/>
<text x="710" y="95" class="label" text-anchor="middle">Start(S), Start(a), End(a, out-a)</text>
<circle class="num" cx="466.3" cy="102" r="9"/>
<text x="466.3" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge" x1="476.3" y1="140" x2="942.8" y2="140"/>
<path class="head" d="M942.8,140 L933.8,144.5 L933.8,135.5 Z"/>
<text x="710" y="133" class="label" text-anchor="middle">Start(b)</text>
<circle class="num" cx="466.3" cy="140" r="9"/>
<text x="466.3" y="143.8" class="num-text" text-anchor="middle">2</text>
<line class="edge" x1="476.3" y1="178" x2="636.8" y2="178"/>
<path class="head" d="M636.8,178 L627.8,182.5 L627.8,173.5 Z"/>
<text x="557" y="171" class="label" text-anchor="middle">executeAction</text>
<circle class="num" cx="466.3" cy="178" r="9"/>
<text x="466.3" y="181.8" class="num-text" text-anchor="middle">3</text>
<line class="edge dash fail" x1="627.8" y1="216" x2="468.3" y2="216"/>
<path class="head-fail" d="M470.3,211 l10,10 M480.3,211 l-10,10"/>
<text x="547" y="209" class="label accent" text-anchor="middle">AbortSagaException</text>
<circle class="num" cx="637.8" cy="216" r="9"/>
<text x="637.8" y="219.8" class="num-text" text-anchor="middle">4</text>
<rect class="note" x="299" y="236" width="334.5" height="44" rx="5"/>
<text x="466.3" y="256" class="label" text-anchor="middle">first abort: stop the forward traversal,</text>
<text x="466.3" y="272" class="label" text-anchor="middle">register the rollback for when no walk is left</text>
<line class="edge" x1="476.3" y1="310" x2="942.8" y2="310"/>
<path class="head" d="M942.8,310 L933.8,314.5 L933.8,305.5 Z"/>
<text x="710" y="303" class="label" text-anchor="middle">write Abort(b)</text>
<circle class="num" cx="466.3" cy="310" r="9"/>
<text x="466.3" y="313.8" class="num-text" text-anchor="middle">5</text>
<rect class="note" x="329.4" y="330" width="273.8" height="44" rx="5"/>
<text x="466.3" y="350" class="label" text-anchor="middle">the walk ends: no walk left,</text>
<text x="466.3" y="366" class="label" text-anchor="middle">so the rollback starts on this thread</text>
<line class="edge" x1="476.3" y1="404" x2="942.8" y2="404"/>
<path class="head" d="M942.8,404 L933.8,408.5 L933.8,399.5 Z"/>
<text x="710" y="397" class="label" text-anchor="middle">read the execution's entries, by node</text>
<circle class="num" cx="466.3" cy="404" r="9"/>
<text x="466.3" y="407.8" class="num-text" text-anchor="middle">6</text>
<rect class="note" x="288.9" y="424" width="354.8" height="28" rx="5"/>
<text x="466.3" y="444" class="label" text-anchor="middle">backward from E: b's last entry is Abort, skip it</text>
<line class="edge" x1="476.3" y1="482" x2="942.8" y2="482"/>
<path class="head" d="M942.8,482 L933.8,486.5 L933.8,477.5 Z"/>
<text x="710" y="475" class="label" text-anchor="middle">write CompStart(a)</text>
<circle class="num" cx="466.3" cy="482" r="9"/>
<text x="466.3" y="485.8" class="num-text" text-anchor="middle">7</text>
<line class="edge" x1="476.3" y1="520" x2="792.8" y2="520"/>
<path class="head" d="M792.8,520 L783.8,524.5 L783.8,515.5 Z"/>
<text x="635" y="513" class="label" text-anchor="middle">executeCompensatingAction(a, input, out-a)</text>
<circle class="num" cx="466.3" cy="520" r="9"/>
<text x="466.3" y="523.8" class="num-text" text-anchor="middle">8</text>
<line class="edge" x1="476.3" y1="558" x2="942.8" y2="558"/>
<path class="head" d="M942.8,558 L933.8,562.5 L933.8,553.5 Z"/>
<text x="710" y="551" class="label" text-anchor="middle">write Comp(a)</text>
<circle class="num" cx="466.3" cy="558" r="9"/>
<text x="466.3" y="561.8" class="num-text" text-anchor="middle">9</text>
<rect class="note" x="423.9" y="578" width="84.8" height="28" rx="5"/>
<text x="466.3" y="598" class="label" text-anchor="middle">reached S</text>
<line class="edge" x1="476.3" y1="636" x2="942.8" y2="636"/>
<path class="head" d="M942.8,636 L933.8,640.5 L933.8,631.5 Z"/>
<text x="710" y="629" class="label" text-anchor="middle">write End(E)</text>
<circle class="num" cx="466.3" cy="636" r="9"/>
<text x="466.3" y="639.8" class="num-text" text-anchor="middle">10</text>
<line class="edge" x1="456.3" y1="674" x2="79" y2="674"/>
<path class="head" d="M79,674 L88,669.5 L88,678.5 Z"/>
<text x="267.1" y="667" class="label" text-anchor="middle">onComplete(failure: AbortSagaException)</text>
<circle class="num" cx="466.3" cy="674" r="9"/>
<text x="466.3" y="677.8" class="num-text" text-anchor="middle">11</text>
<line class="edge dash" x1="456.3" y1="712" x2="79" y2="712"/>
<path class="head" d="M79,712 L88,707.5 L88,716.5 Z"/>
<text x="267.1" y="705" class="label" text-anchor="middle">completion future fails with the AbortSagaException</text>
<circle class="num" cx="466.3" cy="712" r="9"/>
<text x="466.3" y="715.8" class="num-text" text-anchor="middle">12</text>
</svg>
