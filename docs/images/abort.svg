<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1057 754" width="1057" height="754" role="img" aria-labelledby="abort-title abort-desc">
<title id="abort-title">An abort and its rollback</title>
<desc id="abort-desc">b throws AbortSagaException; Abort is written; once no walk is left, the rollback compensates a between CompStart and Comp, writes End on E, and the completion future fails with the AbortSagaException.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<line class="lifeline" x1="78" y1="62" x2="78" y2="738"/>
<rect class="box" x="20" y="20" width="116" height="42" rx="7"/>
<text x="78" y="45.5" class="title" text-anchor="middle">Caller</text>
<line class="lifeline" x1="485.4" y1="62" x2="485.4" y2="738"/>
<rect class="box" x="427.4" y="20" width="116" height="42" rx="7"/>
<text x="485.4" y="45.5" class="title" text-anchor="middle">Walk</text>
<line class="lifeline" x1="668.1" y1="62" x2="668.1" y2="738"/>
<rect class="box" x="608" y="20" width="120.3" height="42" rx="7"/>
<text x="668.1" y="45.5" class="title" text-anchor="middle">Adapter of b</text>
<line class="lifeline" x1="828.6" y1="62" x2="828.6" y2="738"/>
<rect class="box" x="768.5" y="20" width="120.3" height="42" rx="7"/>
<text x="828.6" y="45.5" class="title" text-anchor="middle">Adapter of a</text>
<line class="lifeline" x1="978.6" y1="62" x2="978.6" y2="738"/>
<rect class="box" x="920.6" y="20" width="116" height="42" rx="7"/>
<text x="978.6" y="45.5" class="title" text-anchor="middle">Log</text>
<line class="edge" x1="495.4" y1="102" x2="977.6" y2="102"/>
<path class="head" d="M977.6,102 L968.6,106.5 L968.6,97.5 Z"/>
<text x="737" y="95" class="label" text-anchor="middle">Start(S), Start(a), End(a, out-a)</text>
<circle class="num" cx="485.4" cy="102" r="9"/>
<text x="485.4" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge" x1="495.4" y1="140" x2="977.6" y2="140"/>
<path class="head" d="M977.6,140 L968.6,144.5 L968.6,135.5 Z"/>
<text x="737" y="133" class="label" text-anchor="middle">Start(b)</text>
<circle class="num" cx="485.4" cy="140" r="9"/>
<text x="485.4" y="143.8" class="num-text" text-anchor="middle">2</text>
<line class="edge" x1="495.4" y1="178" x2="667.1" y2="178"/>
<path class="head" d="M667.1,178 L658.1,182.5 L658.1,173.5 Z"/>
<text x="581.8" y="171" class="label" text-anchor="middle">executeAction</text>
<circle class="num" cx="485.4" cy="178" r="9"/>
<text x="485.4" y="181.8" class="num-text" text-anchor="middle">3</text>
<line class="edge dash fail" x1="658.1" y1="216" x2="487.4" y2="216"/>
<path class="head-fail" d="M489.4,211 l10,10 M499.4,211 l-10,10"/>
<text x="571.8" y="209" class="label accent" text-anchor="middle">AbortSagaException</text>
<circle class="num" cx="668.1" cy="216" r="9"/>
<text x="668.1" y="219.8" class="num-text" text-anchor="middle">4</text>
<rect class="note" x="309.5" y="236" width="351.8" height="44" rx="5"/>
<text x="485.4" y="256" class="label" text-anchor="middle">first abort: stop the forward traversal,</text>
<text x="485.4" y="272" class="label" text-anchor="middle">register the rollback for when no walk is left</text>
<line class="edge" x1="495.4" y1="310" x2="977.6" y2="310"/>
<path class="head" d="M977.6,310 L968.6,314.5 L968.6,305.5 Z"/>
<text x="737" y="303" class="label" text-anchor="middle">write Abort(b)</text>
<circle class="num" cx="485.4" cy="310" r="9"/>
<text x="485.4" y="313.8" class="num-text" text-anchor="middle">5</text>
<rect class="note" x="341.6" y="330" width="287.6" height="44" rx="5"/>
<text x="485.4" y="350" class="label" text-anchor="middle">the walk ends: no walk left,</text>
<text x="485.4" y="366" class="label" text-anchor="middle">so the rollback starts on this thread</text>
<line class="edge" x1="495.4" y1="404" x2="977.6" y2="404"/>
<path class="head" d="M977.6,404 L968.6,408.5 L968.6,399.5 Z"/>
<text x="737" y="397" class="label" text-anchor="middle">read the execution's entries, by node</text>
<circle class="num" cx="485.4" cy="404" r="9"/>
<text x="485.4" y="407.8" class="num-text" text-anchor="middle">6</text>
<rect class="note" x="298.8" y="424" width="373.1" height="28" rx="5"/>
<text x="485.4" y="444" class="label" text-anchor="middle">backward from E: b's last entry is Abort, skip it</text>
<line class="edge" x1="495.4" y1="482" x2="977.6" y2="482"/>
<path class="head" d="M977.6,482 L968.6,486.5 L968.6,477.5 Z"/>
<text x="737" y="475" class="label" text-anchor="middle">write CompStart(a)</text>
<circle class="num" cx="485.4" cy="482" r="9"/>
<text x="485.4" y="485.8" class="num-text" text-anchor="middle">7</text>
<line class="edge" x1="495.4" y1="520" x2="827.6" y2="520"/>
<path class="head" d="M827.6,520 L818.6,524.5 L818.6,515.5 Z"/>
<text x="662" y="513" class="label" text-anchor="middle">executeCompensatingAction(a, input, out-a)</text>
<circle class="num" cx="485.4" cy="520" r="9"/>
<text x="485.4" y="523.8" class="num-text" text-anchor="middle">8</text>
<line class="edge" x1="495.4" y1="558" x2="977.6" y2="558"/>
<path class="head" d="M977.6,558 L968.6,562.5 L968.6,553.5 Z"/>
<text x="737" y="551" class="label" text-anchor="middle">write Comp(a)</text>
<circle class="num" cx="485.4" cy="558" r="9"/>
<text x="485.4" y="561.8" class="num-text" text-anchor="middle">9</text>
<rect class="note" x="441.3" y="578" width="88.1" height="28" rx="5"/>
<text x="485.4" y="598" class="label" text-anchor="middle">reached S</text>
<line class="edge" x1="495.4" y1="636" x2="977.6" y2="636"/>
<path class="head" d="M977.6,636 L968.6,640.5 L968.6,631.5 Z"/>
<text x="737" y="629" class="label" text-anchor="middle">write End(E)</text>
<circle class="num" cx="485.4" cy="636" r="9"/>
<text x="485.4" y="639.8" class="num-text" text-anchor="middle">10</text>
<line class="edge" x1="475.4" y1="674" x2="79" y2="674"/>
<path class="head" d="M79,674 L88,669.5 L88,678.5 Z"/>
<text x="276.7" y="667" class="label" text-anchor="middle">onComplete(failure: AbortSagaException)</text>
<circle class="num" cx="485.4" cy="674" r="9"/>
<text x="485.4" y="677.8" class="num-text" text-anchor="middle">11</text>
<line class="edge dash" x1="475.4" y1="712" x2="79" y2="712"/>
<path class="head" d="M79,712 L88,707.5 L88,716.5 Z"/>
<text x="276.7" y="705" class="label" text-anchor="middle">completion future fails with the AbortSagaException</text>
<circle class="num" cx="485.4" cy="712" r="9"/>
<text x="485.4" y="715.8" class="num-text" text-anchor="middle">12</text>
</svg>
