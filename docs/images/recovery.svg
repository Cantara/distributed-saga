<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 634" width="980" height="634" role="img" aria-labelledby="recovery-title recovery-desc">
<title id="recovery-title">Recovery after a crash</title>
<desc id="recovery-desc">The application reads the unfinished execution and runs it again with recovery true: a, which ended, is skipped and its output passed on; b runs again; End on E is written.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<line class="lifeline" x1="206.6" y1="62" x2="206.6" y2="618"/>
<rect class="box" x="107.9" y="20" width="197.3" height="42" rx="7"/>
<text x="206.6" y="45.5" class="title" text-anchor="middle">Application (recovery)</text>
<line class="lifeline" x1="535.6" y1="62" x2="535.6" y2="618"/>
<rect class="box" x="471.5" y="20" width="128" height="42" rx="7"/>
<text x="535.6" y="45.5" class="title" text-anchor="middle">SagaExecution</text>
<line class="lifeline" x1="722.1" y1="62" x2="722.1" y2="618"/>
<rect class="box" x="664.1" y="20" width="116" height="42" rx="7"/>
<text x="722.1" y="45.5" class="title" text-anchor="middle">Walk</text>
<line class="lifeline" x1="901.4" y1="62" x2="901.4" y2="618"/>
<rect class="box" x="843.4" y="20" width="116" height="42" rx="7"/>
<text x="901.4" y="45.5" class="title" text-anchor="middle">Log</text>
<line class="edge" x1="216.6" y1="102" x2="900.4" y2="102"/>
<path class="head" d="M900.4,102 L891.4,106.5 L891.4,97.5 Z"/>
<text x="559" y="95" class="label" text-anchor="middle">readIncompleteSagas()</text>
<circle class="num" cx="206.6" cy="102" r="9"/>
<text x="206.6" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge dash" x1="891.4" y1="140" x2="207.6" y2="140"/>
<path class="head" d="M207.6,140 L216.6,135.5 L216.6,144.5 Z"/>
<text x="549" y="133" class="label" text-anchor="middle">Start(S), Start(a), End(a, out-a), Start(b)</text>
<circle class="num" cx="901.4" cy="140" r="9"/>
<text x="901.4" y="143.8" class="num-text" text-anchor="middle">2</text>
<rect class="note" x="20" y="160" width="373.1" height="44" rx="5"/>
<text x="206.6" y="180" class="label" text-anchor="middle">no End(E): unfinished. Find the saga by its name,</text>
<text x="206.6" y="196" class="label" text-anchor="middle">turn Start(S)'s data back into the input</text>
<line class="edge" x1="216.6" y1="234" x2="534.6" y2="234"/>
<path class="head" d="M534.6,234 L525.6,238.5 L525.6,229.5 Z"/>
<text x="376.1" y="227" class="label" text-anchor="middle">executeSaga(id, input, true, onComplete)</text>
<circle class="num" cx="206.6" cy="234" r="9"/>
<text x="206.6" y="237.8" class="num-text" text-anchor="middle">3</text>
<line class="edge" x1="545.6" y1="272" x2="900.4" y2="272"/>
<path class="head" d="M900.4,272 L891.4,276.5 L891.4,267.5 Z"/>
<text x="723.5" y="265" class="label" text-anchor="middle">read the execution's entries, by node</text>
<circle class="num" cx="535.6" cy="272" r="9"/>
<text x="535.6" y="275.8" class="num-text" text-anchor="middle">4</text>
<line class="edge" x1="545.6" y1="310" x2="721.1" y2="310"/>
<path class="head" d="M721.1,310 L712.1,314.5 L712.1,305.5 Z"/>
<text x="633.8" y="303" class="label" text-anchor="middle">submit the walk at S</text>
<circle class="num" cx="535.6" cy="310" r="9"/>
<text x="535.6" y="313.8" class="num-text" text-anchor="middle">5</text>
<rect class="note" x="592.5" y="330" width="259.1" height="44" rx="5"/>
<text x="722.1" y="350" class="label" text-anchor="middle">S: Start(S) is not written again,</text>
<text x="722.1" y="366" class="label" text-anchor="middle">the handoff future completes</text>
<rect class="note" x="581.8" y="386" width="280.5" height="44" rx="5"/>
<text x="722.1" y="406" class="label" text-anchor="middle">a: last entry End, so it is not run,</text>
<text x="722.1" y="422" class="label" text-anchor="middle">and out-a is passed on</text>
<rect class="note" x="574.7" y="442" width="294.8" height="44" rx="5"/>
<text x="722.1" y="462" class="label" text-anchor="middle">b: last entry Start, so it runs again,</text>
<text x="722.1" y="478" class="label" text-anchor="middle">without a second Start</text>
<line class="edge" x1="732.1" y1="516" x2="900.4" y2="516"/>
<path class="head" d="M900.4,516 L891.4,520.5 L891.4,511.5 Z"/>
<text x="816.8" y="509" class="label" text-anchor="middle">write End(b, out-b)</text>
<circle class="num" cx="722.1" cy="516" r="9"/>
<text x="722.1" y="519.8" class="num-text" text-anchor="middle">6</text>
<line class="edge" x1="732.1" y1="554" x2="900.4" y2="554"/>
<path class="head" d="M900.4,554 L891.4,558.5 L891.4,549.5 Z"/>
<text x="816.8" y="547" class="label" text-anchor="middle">write End(E)</text>
<circle class="num" cx="722.1" cy="554" r="9"/>
<text x="722.1" y="557.8" class="num-text" text-anchor="middle">7</text>
<line class="edge" x1="712.1" y1="592" x2="207.6" y2="592"/>
<path class="head" d="M207.6,592 L216.6,587.5 L216.6,596.5 Z"/>
<text x="459.3" y="585" class="label" text-anchor="middle">onComplete(success)</text>
<circle class="num" cx="722.1" cy="592" r="9"/>
<text x="722.1" y="595.8" class="num-text" text-anchor="middle">8</text>
</svg>
