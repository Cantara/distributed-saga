<path class="head" d="M79,254 L88,249.5 L88,258.5 Z"/>
<text x="334.3" y="247" class="label" text-anchor="middle">handoff future completes</text>
<circle class="num" cx="600.6" cy="254" r="9"/>
<text x="600.6" y="257.8" class="num-text" text-anchor="middle">5</text>
<line class="edge" x1="610.6" y1="292" x2="1069.2" y2="292"/>
<path class="head" d="M1069.2,292 L1060.2,296.5 L1060.2,287.5 Z"/>
<text x="840.4" y="285" class="label" text-anchor="middle">write Start(a), and wait</text>
<circle class="num" cx="600.6" cy="292" r="9"/>
<text x="600.6" y="295.8" class="num-text" text-anchor="middle">6</text>
<line class="edge" x1="610.6" y1="330" x2="907.3" y2="330"/>
<path class="head" d="M907.3,330 L898.3,334.5 L898.3,325.5 Z"/>
<text x="759.4" y="323" class="label" text-anchor="middle">executeAction(a, input, outputs of S)</text>
<circle class="num" cx="600.6" cy="330" r="9"/>
<text x="600.6" y="333.8" class="num-text" text-anchor="middle">7</text>
<line class="edge dash" x1="898.3" y1="368" x2="601.6" y2="368"/>
<path class="head" d="M601.6,368 L610.6,363.5 L610.6,372.5 Z"/>
<text x="749.4" y="361" class="label" text-anchor="middle">output</text>
<circle class="num" cx="908.3" cy="368" r="9"/>
<text x="908.3" y="371.8" class="num-text" text-anchor="middle">8</text>
<line class="edge" x1="610.6" y1="406" x2="1069.2" y2="406"/>
<path class="head" d="M1069.2,406 L1060.2,410.5 L1060.2,401.5 Z"/>
<text x="840.4" y="399" class="label" text-anchor="middle">write End(a, output), and wait</text>
<circle class="num" cx="600.6" cy="406" r="9"/>
<text x="600.6" y="409.8" class="num-text" text-anchor="middle">9</text>
<line class="edge" x1="610.6" y1="444" x2="1069.2" y2="444"/>
<path class="head" d="M1069.2,444 L1060.2,448.5 L1060.2,439.5 Z"/>
<text x="840.4" y="437" class="label" text-anchor="middle">write End(E), and wait</text>
<circle class="num" cx="600.6" cy="444" r="9"/>
<text x="600.6" y="447.8" class="num-text" text-anchor="middle">10</text>
<line class="edge" x1="590.6" y1="482" x2="79" y2="482"/>
<path class="head" d="M79,482 L88,477.5 L88,486.5 Z"/>
<text x="334.3" y="475" class="label" text-anchor="middle">onComplete(success)</text>
<circle class="num" cx="600.6" cy="482" r="9"/>
<text x="600.6" y="485.8" class="num-text" text-anchor="middle">11</text>
<line class="edge dash" x1="590.6" y1="520" x2="79" y2="520"/>
<path class="head" d="M79,520 L88,515.5 L88,524.5 Z"/>
<text x="334.3" y="513" class="label" text-anchor="middle">completion future completes</text>
