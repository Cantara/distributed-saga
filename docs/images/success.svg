<path class="head" d="M397.8,102 L388.8,106.5 L388.8,97.5 Z"/>
<text x="243.4" y="95" class="label" text-anchor="middle">executeSaga(id, input, false, onComplete)</text>
<circle class="num" cx="78" cy="102" r="9"/>
<text x="78" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge" x1="408.8" y1="140" x2="576.8" y2="140"/>
<path class="head" d="M576.8,140 L567.8,144.5 L567.8,135.5 Z"/>
<text x="493.3" y="133" class="label" text-anchor="middle">submit the walk at S</text>
<circle class="num" cx="398.8" cy="140" r="9"/>
<text x="398.8" y="143.8" class="num-text" text-anchor="middle">2</text>
<line class="edge dash" x1="388.8" y1="178" x2="79" y2="178"/>
<path class="head" d="M79,178 L88,173.5 L88,182.5 Z"/>
<text x="233.4" y="171" class="label" text-anchor="middle">SagaHandoffControl</text>
<circle class="num" cx="398.8" cy="178" r="9"/>
<text x="398.8" y="181.8" class="num-text" text-anchor="middle">3</text>
<line class="edge" x1="587.8" y1="216" x2="1027.4" y2="216"/>
<path class="head" d="M1027.4,216 L1018.4,220.5 L1018.4,211.5 Z"/>
<text x="808.1" y="209" class="label" text-anchor="middle">write Start(S, saga name, input), and wait</text>
