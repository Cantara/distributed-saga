<circle class="num" cx="577.8" cy="254" r="9"/>
<text x="577.8" y="257.8" class="num-text" text-anchor="middle">5</text>
<line class="edge" x1="587.8" y1="292" x2="1027.4" y2="292"/>
<path class="head" d="M1027.4,292 L1018.4,296.5 L1018.4,287.5 Z"/>
<text x="808.1" y="285" class="label" text-anchor="middle">write Start(a), and wait</text>
<circle class="num" cx="577.8" cy="292" r="9"/>
<text x="577.8" y="295.8" class="num-text" text-anchor="middle">6</text>
<line class="edge" x1="587.8" y1="330" x2="870.5" y2="330"/>
<path class="head" d="M870.5,330 L861.5,334.5 L861.5,325.5 Z"/>
<text x="729.6" y="323" class="label" text-anchor="middle">executeAction(a, input, outputs of S)</text>
<circle class="num" cx="577.8" cy="330" r="9"/>
<text x="577.8" y="333.8" class="num-text" text-anchor="middle">7</text>
<line class="edge dash" x1="861.5" y1="368" x2="578.8" y2="368"/>
<path class="head" d="M578.8,368 L587.8,363.5 L587.8,372.5 Z"/>
<text x="719.6" y="361" class="label" text-anchor="middle">output</text>
<circle class="num" cx="871.5" cy="368" r="9"/>
<text x="871.5" y="371.8" class="num-text" text-anchor="middle">8</text>
<line class="edge" x1="587.8" y1="406" x2="1027.4" y2="406"/>
<path class="head" d="M1027.4,406 L1018.4,410.5 L1018.4,401.5 Z"/>
<text x="808.1" y="399" class="label" text-anchor="middle">write End(a, output), and wait</text>
<circle class="num" cx="577.8" cy="406" r="9"/>
<text x="577.8" y="409.8" class="num-text" text-anchor="middle">9</text>
<line class="edge" x1="587.8" y1="444" x2="1027.4" y2="444"/>
<path class="head" d="M1027.4,444 L1018.4,448.5 L1018.4,439.5 Z"/>
<text x="808.1" y="437" class="label" text-anchor="middle">write End(E), and wait</text>
<circle class="num" cx="577.8" cy="444" r="9"/>
<text x="577.8" y="447.8" class="num-text" text-anchor="middle">10</text>
<line class="edge" x1="567.8" y1="482" x2="79" y2="482"/>
<path class="head" d="M79,482 L88,477.5 L88,486.5 Z"/>
<text x="322.9" y="475" class="label" text-anchor="middle">onComplete(success)</text>
<circle class="num" cx="577.8" cy="482" r="9"/>
<text x="577.8" y="485.8" class="num-text" text-anchor="middle">11</text>
<line class="edge dash" x1="567.8" y1="520" x2="79" y2="520"/>
<path class="head" d="M79,520 L88,515.5 L88,524.5 Z"/>
<text x="322.9" y="513" class="label" text-anchor="middle">completion future completes</text>
