<line class="lifeline" x1="398.8" y1="62" x2="398.8" y2="546"/>
<rect class="box" x="337.4" y="20" width="122.8" height="42" rx="7"/>
<text x="398.8" y="45.5" class="title" text-anchor="middle">SagaExecution</text>
