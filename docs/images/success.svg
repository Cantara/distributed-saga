<line class="lifeline" x1="414.1" y1="62" x2="414.1" y2="546"/>
<rect class="box" x="350.1" y="20" width="128" height="42" rx="7"/>
<text x="414.1" y="45.5" class="title" text-anchor="middle">SagaExecution</text>
