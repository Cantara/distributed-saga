<path class="head" d="M413.1,102 L404.1,106.5 L404.1,97.5 Z"/>
<text x="251.1" y="95" class="label" text-anchor="middle">executeSaga(id, input, false, onComplete)</text>
<circle class="num" cx="78" cy="102" r="9"/>
<text x="78" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge" x1="424.1" y1="140" x2="599.6" y2="140"/>
<path class="head" d="M599.6,140 L590.6,144.5 L590.6,135.5 Z"/>
<text x="512.4" y="133" class="label" text-anchor="middle">submit the walk at S</text>
<circle class="num" cx="414.1" cy="140" r="9"/>
<text x="414.1" y="143.8" class="num-text" text-anchor="middle">2</text>
<line class="edge dash" x1="404.1" y1="178" x2="79" y2="178"/>
<path class="head" d="M79,178 L88,173.5 L88,182.5 Z"/>
<text x="241.1" y="171" class="label" text-anchor="middle">SagaHandoffControl</text>
<circle class="num" cx="414.1" cy="178" r="9"/>
<text x="414.1" y="181.8" class="num-text" text-anchor="middle">3</text>
<line class="edge" x1="610.6" y1="216" x2="1069.2" y2="216"/>
<path class="head" d="M1069.2,216 L1060.2,220.5 L1060.2,211.5 Z"/>
<text x="840.4" y="209" class="label" text-anchor="middle">write Start(S, saga name, input), and wait</text>
