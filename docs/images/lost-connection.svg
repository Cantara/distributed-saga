<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 603 668" width="603" height="668" role="img" aria-labelledby="lost-connection-title lost-connection-desc">
<title id="lost-connection-title">A PostgreSQL log loses its connection</title>
<desc id="lost-connection-desc">The session evicts the connection, takes the advisory lock again on a new one, and checks the owner token: still its own, it writes again; changed, it refuses with SagaLogBusyException.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<rect class="group" x="199" y="280" width="384" height="70" rx="6"/>
<path class="tab" d="M199,286 a6,6 0 0 1 6,-6 h41 v14 l-8,8 h-39 Z"/>
<text x="208" y="296" class="title">loop</text>
<text x="256" y="296" class="label">[up to 10 s]</text>
<rect class="group" x="20" y="404" width="563" height="230" rx="6"/>
<path class="tab" d="M20,410 a6,6 0 0 1 6,-6 h34.3 v14 l-8,8 h-32.2 Z"/>
<text x="29" y="420" class="title">alt</text>
<text x="70.3" y="420" class="label">[the token is still its own]</text>
<line class="divider" x1="20" y1="512" x2="583" y2="512"/>
<text x="30" y="529" class="label">[the token changed, or the row is gone]</text>
<line class="lifeline" x1="82" y1="62" x2="82" y2="652"/>
<rect class="box" x="24" y="20" width="116" height="42" rx="7"/>
<text x="82" y="45.5" class="title" text-anchor="middle">Walk</text>
<line class="lifeline" x1="261" y1="62" x2="261" y2="652"/>
<rect class="box" x="203" y="20" width="116" height="42" rx="7"/>
<text x="261" y="45.5" class="title" text-anchor="middle">LogSession</text>
<line class="lifeline" x1="521" y1="62" x2="521" y2="652"/>
<rect class="box" x="463" y="20" width="116" height="42" rx="7"/>
<text x="521" y="45.5" class="title" text-anchor="middle">PostgreSQL</text>
<line class="edge" x1="92" y1="102" x2="260" y2="102"/>
<path class="head" d="M260,102 L251,106.5 L251,97.5 Z"/>
<text x="176.5" y="95" class="label" text-anchor="middle">write(entry)</text>
<circle class="num" cx="82" cy="102" r="9"/>
<text x="82" y="105.8" class="num-text" text-anchor="middle">1</text>
<line class="edge" x1="271" y1="140" x2="520" y2="140"/>
<path class="head" d="M520,140 L511,144.5 L511,135.5 Z"/>
<text x="396" y="133" class="label" text-anchor="middle">INSERT</text>
<circle class="num" cx="261" cy="140" r="9"/>
<text x="261" y="143.8" class="num-text" text-anchor="middle">2</text>
<line class="edge dash fail" x1="511" y1="178" x2="263" y2="178"/>
<path class="head-fail" d="M265,173 l10,10 M275,173 l-10,10"/>
<text x="386" y="171" class="label accent" text-anchor="middle">connection lost (SQLState 08...)</text>
<circle class="num" cx="521" cy="178" r="9"/>
<text x="521" y="181.8" class="num-text" text-anchor="middle">3</text>
<rect class="note" x="181.5" y="198" width="159" height="28" rx="5"/>
<text x="261" y="218" class="label" text-anchor="middle">evict the connection</text>
<line class="edge" x1="271" y1="256" x2="520" y2="256"/>
<path class="head" d="M520,256 L511,260.5 L511,251.5 Z"/>
<text x="396" y="249" class="label" text-anchor="middle">new connection</text>
<circle class="num" cx="261" cy="256" r="9"/>
<text x="261" y="259.8" class="num-text" text-anchor="middle">4</text>
<line class="edge" x1="271" y1="328" x2="520" y2="328"/>
<path class="head" d="M520,328 L511,332.5 L511,323.5 Z"/>
<text x="396" y="321" class="label" text-anchor="middle">pg_try_advisory_lock(lock_key)</text>
<circle class="num" cx="261" cy="328" r="9"/>
<text x="261" y="331.8" class="num-text" text-anchor="middle">5</text>
<line class="edge" x1="271" y1="380" x2="520" y2="380"/>
<path class="head" d="M520,380 L511,384.5 L511,375.5 Z"/>
<text x="396" y="373" class="label" text-anchor="middle">read owner_token</text>
<circle class="num" cx="261" cy="380" r="9"/>
<text x="261" y="383.8" class="num-text" text-anchor="middle">6</text>
<line class="edge" x1="271" y1="452" x2="520" y2="452"/>
<path class="head" d="M520,452 L511,456.5 L511,447.5 Z"/>
<text x="396" y="445" class="label" text-anchor="middle">INSERT again, commit</text>
<circle class="num" cx="261" cy="452" r="9"/>
<text x="261" y="455.8" class="num-text" text-anchor="middle">7</text>
<line class="edge dash" x1="251" y1="490" x2="83" y2="490"/>
<path class="head" d="M83,490 L92,485.5 L92,494.5 Z"/>
<text x="166.5" y="483" class="label" text-anchor="middle">the entry</text>
<circle class="num" cx="261" cy="490" r="9"/>
<text x="261" y="493.8" class="num-text" text-anchor="middle">8</text>
<rect class="note" x="90.4" y="538" width="341.3" height="44" rx="5"/>
<text x="261" y="558" class="label" text-anchor="middle">another process held the log: give the lock up,</text>
<text x="261" y="574" class="label" text-anchor="middle">refuse this and every later operation</text>
<line class="edge dash fail" x1="251" y1="612" x2="84" y2="612"/>
<path class="head-fail" d="M86,607 l10,10 M96,607 l-10,10"/>
<text x="166.5" y="605" class="label accent" text-anchor="middle">SagaLogBusyException</text>
<circle class="num" cx="261" cy="612" r="9"/>
<text x="261" y="615.8" class="num-text" text-anchor="middle">9</text>
</svg>
