<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" width="960" height="588" role="img" aria-labelledby="instance-title instance-desc">
<title id="instance-title">Inside one application instance</title>
<desc id="instance-desc">The application calls executeSaga on a SagaExecution and takes and releases saga logs from the SagaLogPool. The execution runs its walks on the application's SelectableThreadPoolExecutor, whose threads call the adapters, which change databases, queues and services. The execution writes and reads its SagaLog, which the pool keeps in the saga-log storage.</desc>
