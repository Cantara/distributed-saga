<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 616" width="1172" height="616" role="img" aria-labelledby="take-log-title take-log-desc">
<title id="take-log-title">Taking and releasing a saga log</title>
<desc id="take-log-desc">tryAcquire takes the next available log; the first time, the PostgreSQL session takes its lock key, its advisory lock and a new owner token, and creates its table; releaseOwnership puts the log back in the queue.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<line class="lifeline" x1="170.9" y1="62" x2="170.9" y2="600"/>
<rect class="box" x="112.9" y="20" width="116" height="42" rx="7"/>
<text x="170.9" y="45.5" class="title" text-anchor="middle">Application</text>
<line class="lifeline" x1="428.7" y1="62" x2="428.7" y2="600"/>
<rect class="box" x="370.7" y="20" width="116" height="42" rx="7"/>
<text x="428.7" y="45.5" class="title" text-anchor="middle">SagaLogPool</text>
<line class="lifeline" x1="686.4" y1="62" x2="686.4" y2="600"/>
<rect class="box" x="628.4" y="20" width="116" height="42" rx="7"/>
<text x="686.4" y="45.5" class="title" text-anchor="middle">LogSession</text>
<line class="lifeline" x1="1093.8" y1="62" x2="1093.8" y2="600"/>
<rect class="box" x="1035.8" y="20" width="116" height="42" rx="7"/>
<text x="1093.8" y="45.5" class="title" text-anchor="middle">PostgreSQL</text>
<line class="edge" x1="180.9" y1="102" x2="427.7" y2="102"/>
<path class="head" d="M427.7,102 L418.7,106.5 L418.7,97.5 Z"/>
<text x="304.8" y="95" class="label" text-anchor="middle">tryAcquire(owner, 10, SECONDS)</text>
<circle class="num" cx="170.9" cy="102" r="9"/>
<text x="170.9" y="105.8" class="num-text" text-anchor="middle">1</text>
<rect class="note" x="252.8" y="122" width="351.8" height="44" rx="5"/>
<text x="428.7" y="142" class="label" text-anchor="middle">take the next log id from the available queue,</text>
<text x="428.7" y="158" class="label" text-anchor="middle">then that log's permit</text>
<line class="edge" x1="438.7" y1="196" x2="685.4" y2="196"/>
<path class="head" d="M685.4,196 L676.4,200.5 L676.4,191.5 Z"/>
<text x="562.6" y="189" class="label" text-anchor="middle">open the log (first time only)</text>
<circle class="num" cx="428.7" cy="196" r="9"/>
<text x="428.7" y="199.8" class="num-text" text-anchor="middle">2</text>
<line class="edge" x1="696.4" y1="234" x2="1092.8" y2="234"/>
<path class="head" d="M1092.8,234 L1083.8,238.5 L1083.8,229.5 Z"/>
<text x="895.1" y="227" class="label" text-anchor="middle">find or assign lock_key in Locks, commit</text>
<circle class="num" cx="686.4" cy="234" r="9"/>
<text x="686.4" y="237.8" class="num-text" text-anchor="middle">3</text>
<line class="edge" x1="696.4" y1="272" x2="1092.8" y2="272"/>
<path class="head" d="M1092.8,272 L1083.8,276.5 L1083.8,267.5 Z"/>
<text x="895.1" y="265" class="label" text-anchor="middle">pg_try_advisory_lock(lock_key)</text>
<circle class="num" cx="686.4" cy="272" r="9"/>
<text x="686.4" y="275.8" class="num-text" text-anchor="middle">4</text>
<line class="edge dash" x1="1083.8" y1="310" x2="687.4" y2="310"/>
<path class="head" d="M687.4,310 L696.4,305.5 L696.4,314.5 Z"/>
<text x="885.1" y="303" class="label" text-anchor="middle">true</text>
<circle class="num" cx="1093.8" cy="310" r="9"/>
<text x="1093.8" y="313.8" class="num-text" text-anchor="middle">5</text>
<line class="edge" x1="696.4" y1="348" x2="1092.8" y2="348"/>
<path class="head" d="M1092.8,348 L1083.8,352.5 L1083.8,343.5 Z"/>
<text x="895.1" y="341" class="label" text-anchor="middle">write a new owner_token in Locks</text>
<circle class="num" cx="686.4" cy="348" r="9"/>
<text x="686.4" y="351.8" class="num-text" text-anchor="middle">6</text>
<line class="edge" x1="696.4" y1="386" x2="1092.8" y2="386"/>
<path class="head" d="M1092.8,386 L1083.8,390.5 L1083.8,381.5 Z"/>
<text x="895.1" y="379" class="label" text-anchor="middle">create the log's table and index if missing, commit</text>
<circle class="num" cx="686.4" cy="386" r="9"/>
<text x="686.4" y="389.8" class="num-text" text-anchor="middle">7</text>
<line class="edge dash" x1="418.7" y1="424" x2="171.9" y2="424"/>
<path class="head" d="M171.9,424 L180.9,419.5 L180.9,428.5 Z"/>
<text x="294.8" y="417" class="label" text-anchor="middle">SagaLog, owned by owner</text>
<circle class="num" cx="428.7" cy="424" r="9"/>
<text x="428.7" y="427.8" class="num-text" text-anchor="middle">8</text>
<rect class="note" x="20" y="444" width="301.9" height="44" rx="5"/>
<text x="170.9" y="464" class="label" text-anchor="middle">run the saga on the log, and onComplete</text>
<text x="170.9" y="480" class="label" text-anchor="middle">truncates it once the saga is finished</text>
<line class="edge" x1="180.9" y1="518" x2="427.7" y2="518"/>
<path class="head" d="M427.7,518 L418.7,522.5 L418.7,513.5 Z"/>
<text x="304.8" y="511" class="label" text-anchor="middle">releaseOwnership(owner, logId)</text>
<circle class="num" cx="170.9" cy="518" r="9"/>
<text x="170.9" y="521.8" class="num-text" text-anchor="middle">9</text>
<rect class="note" x="256.4" y="538" width="344.6" height="44" rx="5"/>
<text x="428.7" y="558" class="label" text-anchor="middle">drop the ownership, release the permit,</text>
<text x="428.7" y="574" class="label" text-anchor="middle">put the id at the back of the available queue</text>
</svg>
