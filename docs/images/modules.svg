<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 338" width="960" height="338" role="img" aria-labelledby="modules-title modules-desc">
<title id="modules-title">The modules and what they depend on</title>
<desc id="modules-desc">saga-execution depends on saga-api, future-selector and sagalog-api. saga-serialization depends on saga-api. sagalog-file and sagalog-postgres depend on sagalog-api. saga-api, future-selector and sagalog-api depend on nothing.</desc>
<style>
.bg{fill:#fbfbf9}
.box{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.2}
.lib{fill:#fbe9ea;stroke:#b3262c;stroke-width:1.5}
.frame{fill:none;stroke:#8f9297;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#b3262c;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#8f9297;stroke-width:1.1}
.tab{fill:#f2f2ef;stroke:#8f9297;stroke-width:1.1}
.divider{stroke:#8f9297;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#8f9297;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#8f9297;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#b3262c}
.head{fill:#8f9297}
.head-fail{fill:none;stroke:#b3262c;stroke-width:1.8}
.note{fill:#fff7e0;stroke:#d9c17a;stroke-width:1}
.num{fill:#1d1f22}
.num-text{fill:#fbfbf9;font-size:10.5px;font-weight:700}
text{fill:#1d1f22;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#55595f;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#b3262c}
.ok{fill:#1f7a4d}
@media (prefers-color-scheme: dark){
.bg{fill:#121315}
.box{fill:#202226;stroke:#7b7f86;stroke-width:1.2}
.lib{fill:#3a1c1e;stroke:#f06a70;stroke-width:1.5}
.frame{fill:none;stroke:#7b7f86;stroke-width:1.2;stroke-dasharray:6 4}
.frame-lib{fill:none;stroke:#f06a70;stroke-width:1.4;stroke-dasharray:6 4}
.group{fill:none;stroke:#7b7f86;stroke-width:1.1}
.tab{fill:#202226;stroke:#7b7f86;stroke-width:1.1}
.divider{stroke:#7b7f86;stroke-width:1;stroke-dasharray:4 4}
.lifeline{stroke:#7b7f86;stroke-width:1;stroke-dasharray:3 4}
.edge{fill:none;stroke:#7b7f86;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.fail{stroke:#ff8a8f}
.head{fill:#7b7f86}
.head-fail{fill:none;stroke:#ff8a8f;stroke-width:1.8}
.note{fill:#2b2617;stroke:#6b5c2c;stroke-width:1}
.num{fill:#e9e9e6}
.num-text{fill:#121315;font-size:10.5px;font-weight:700}
text{fill:#e9e9e6;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px}
.title{font-size:13.5px;font-weight:650}
.small{fill:#a8aaad;font-size:11.5px}
.label{font-size:12.5px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px}
.accent{fill:#f06a70}
.ok{fill:#5fc995}
}
</style>
<rect class="bg" width="100%" height="100%" rx="8"/>
<text x="30" y="32" class="small">Each arrow points to a module the other one needs at run time.</text>
<rect class="box" x="30" y="50" width="180" height="62" rx="7"/>
<text x="120" y="70.5" class="mono title" text-anchor="middle">saga-serialization</text>
<text x="120" y="85.5" class="small" text-anchor="middle">sagas to and from JSON</text>
<text x="120" y="100.5" class="small" text-anchor="middle">org.json</text>
<rect class="lib" x="290" y="50" width="180" height="62" rx="7"/>
<text x="380" y="70.5" class="mono title" text-anchor="middle">saga-execution</text>
<text x="380" y="85.5" class="small" text-anchor="middle">runs sagas</text>
<text x="380" y="100.5" class="small" text-anchor="middle">no third-party dependencies</text>
<rect class="box" x="530" y="50" width="180" height="62" rx="7"/>
<text x="620" y="70.5" class="mono title" text-anchor="middle">sagalog-file</text>
<text x="620" y="85.5" class="small" text-anchor="middle">the file log</text>
<text x="620" y="100.5" class="small" text-anchor="middle">no third-party dependencies</text>
<rect class="box" x="750" y="50" width="180" height="62" rx="7"/>
<text x="840" y="70.5" class="mono title" text-anchor="middle">sagalog-postgres</text>
<text x="840" y="85.5" class="small" text-anchor="middle">the PostgreSQL log</text>
<text x="840" y="100.5" class="small" text-anchor="middle">HikariCP, JDBC driver, SLF4J</text>
<rect class="box" x="30" y="220" width="180" height="62" rx="7"/>
<text x="120" y="240.5" class="mono title" text-anchor="middle">saga-api</text>
<text x="120" y="255.5" class="small" text-anchor="middle">Saga, SagaNode, the builder</text>
<text x="120" y="270.5" class="small" text-anchor="middle">no dependencies</text>
<rect class="box" x="290" y="220" width="180" height="62" rx="7"/>
<text x="380" y="240.5" class="mono title" text-anchor="middle">future-selector</text>
<text x="380" y="255.5" class="small" text-anchor="middle">futures, the thread pool</text>
<text x="380" y="270.5" class="small" text-anchor="middle">no dependencies</text>
<rect class="box" x="640" y="220" width="180" height="62" rx="7"/>
<text x="730" y="240.5" class="mono title" text-anchor="middle">sagalog-api</text>
<text x="730" y="255.5" class="small" text-anchor="middle">the SPI, the pool, memory log</text>
<text x="730" y="270.5" class="small" text-anchor="middle">no dependencies</text>
<path class="edge" d="M120,112 L120,220"/>
<path class="head" d="M120,220 L115.5,211 L124.5,211 Z"/>
<path class="edge" d="M340,112 L170,220"/>
<path class="head" d="M170,220 L175.2,211.4 L180,219 Z"/>
<path class="edge" d="M380,112 L380,220"/>
<path class="head" d="M380,220 L375.5,211 L384.5,211 Z"/>
<path class="edge" d="M420,112 L680,220"/>
<path class="head" d="M680,220 L670,220.7 L673.4,212.4 Z"/>
<path class="edge" d="M620,112 L720,220"/>
<path class="head" d="M720,220 L710.6,216.5 L717.2,210.3 Z"/>
<path class="edge" d="M840,112 L770,220"/>
<path class="head" d="M770,220 L771.1,210 L778.7,214.9 Z"/>
<text x="30" y="318" class="small">An application depends on saga-execution and one saga-log provider; saga-serialization when it keeps sagas as JSON.</text>
</svg>
